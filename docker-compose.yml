# Local stack. Values come from .env (make up copies .env.example).
name: flashtix

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make up, or copy .env.example to .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - "127.0.0.1:5433:5432" # debugging only: psql -h 127.0.0.1 -p 5433 -U postgres
    healthcheck:
      # Over TCP on purpose: during first-time init Postgres listens on the socket only,
      # so this stays unhealthy until the init script has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # Append-only file, fsync once per second: holds may lose ~1 s on a crash (acceptable).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6380:6379" # host-side tests and debugging: redis-cli -p 6380
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  auth-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: auth
    environment:
      SERVICE_NAME: auth
      LOG_LEVEL: INFO
      JWT_PRIVATE_KEY_PATH: /secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /secrets/jwt_public.pem
      AUTH_DATABASE_URL: postgresql+asyncpg://auth_user:${AUTH_DB_PASSWORD:?}@postgres:5432/authdb
      BOOTSTRAP_ORGANIZER_EMAIL: ${BOOTSTRAP_ORGANIZER_EMAIL:-}
      BOOTSTRAP_ORGANIZER_PASSWORD: ${BOOTSTRAP_ORGANIZER_PASSWORD:-}
      BOOTSTRAP_ORGANIZER_NAME: ${BOOTSTRAP_ORGANIZER_NAME:-Organizer}
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: &service-healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  catalog-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: catalog
    environment:
      SERVICE_NAME: catalog
      LOG_LEVEL: INFO
      JWT_PUBLIC_KEY_PATH: /secrets/jwt_public.pem
      CATALOG_DATABASE_URL: postgresql+asyncpg://catalog_user:${CATALOG_DB_PASSWORD:?}@postgres:5432/catalogdb
      REDIS_URL: redis://redis:6379/0
      CATALOG_CACHE_ENABLED: ${CATALOG_CACHE_ENABLED:-true}
      CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-30}
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *service-healthcheck

  booking-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        SERVICE: booking
    environment:
      SERVICE_NAME: booking
      LOG_LEVEL: INFO
      JWT_PUBLIC_KEY_PATH: /secrets/jwt_public.pem
      BOOKING_DATABASE_URL: postgresql+asyncpg://booking_user:${BOOKING_DB_PASSWORD:?}@postgres:5432/bookingdb
      REDIS_URL: redis://redis:6379/0
      CATALOG_URL: http://catalog-service:8000
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-600}
      MAX_SEATS_PER_BOOKING: ${MAX_SEATS_PER_BOOKING:-6}
      MOCK_PAYMENT_LATENCY_MS: ${MOCK_PAYMENT_LATENCY_MS:-0}
      EVENT_BACKEND: log # http (ticket-pdf function) arrives later
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /data/storage
    volumes:
      - ./secrets:/secrets:ro
      - storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck: *service-healthcheck

  frontend:
    build: ./frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build: ./gateway
    ports:
      - "8080:80" # the only public entry point
    environment:
      BOOKING_RATE_LIMIT: ${BOOKING_RATE_LIMIT:-5r/s}
      BOOKING_RATE_BURST: ${BOOKING_RATE_BURST:-10}
      GATEWAY_ACCESS_LOG: ${GATEWAY_ACCESS_LOG:-/dev/stdout}
      GATEWAY_RESOLVER: 127.0.0.11 # Docker's embedded DNS
    # Upstreams are resolved per request, so the frontend can join later without restarting
    # the gateway (it answers 502 until then).
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/gateway/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
  storage: # tickets/ and reports/, shared with the functions (local stand-in for GCS)
