name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/**/pyproject.toml
            services/**/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: make lint PY=python
      # Integration tests use the compose postgres (127.0.0.1:5433) and redis (127.0.0.1:6380).
      - run: cp .env.example .env && docker compose up -d --wait postgres redis
      - run: make test PY=python
        env:
          REQUIRE_DB: "1" # DB tests that honor it fail instead of silently skipping

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && make keys
      - run: docker compose up -d --wait postgres redis auth-service catalog-service gateway
      - run: make db-check
      - run: make gateway-check
      - if: failure()
        run: docker compose logs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
