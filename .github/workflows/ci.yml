name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/**/pyproject.toml
            services/**/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: make lint PY=python
      # Integration tests use the compose postgres (127.0.0.1:5433) and redis (127.0.0.1:6380).
      - run: cp .env.example .env && docker compose up -d --wait postgres redis
      - run: make test PY=python
        env:
          REQUIRE_DB: "1" # conftest.py: any skipped test fails instead of passing silently

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && make keys
      - run: docker compose up -d --wait postgres redis auth-service catalog-service gateway
      - run: make db-check
      - run: make gateway-check
      - if: failure()
        run: docker compose logs

  e2e:
    # The whole stack from scratch on a fresh machine, then the scripts, once as microservices
    # and once as the monolith: same code, same API, same checks.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: microservices
            monolith: ""
            compose_file: docker-compose.yml
          - mode: monolith
            monolith: "1"
            compose_file: docker-compose.yml:docker-compose.monolith.yml
    name: e2e (${{ matrix.mode }})
    env:
      MONOLITH: ${{ matrix.monolith }}
      COMPOSE_FILE: ${{ matrix.compose_file }}
    steps:
      - uses: actions/checkout@v4
      - run: make up # creates .env and keys, builds every image, waits until all are healthy
      - run: make seed
      - run: make smoke
      - run: make oversell strict=1 # a fresh stack has only real events: unknown ones are a bug
      - name: today's report (Istanbul) contains the smoke test's bookings
        run: |
          summary="$(make report date="$(TZ=Europe/Istanbul date +%F)")"
          echo "$summary"
          python3 -c 'import json, sys; s = json.loads(sys.argv[1]); assert s["bookings"] > 0, s' "$summary"
      - if: failure()
        run: docker compose logs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
