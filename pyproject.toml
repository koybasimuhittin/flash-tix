# Repo-wide tool config only; each service and library has its own packaging.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["flashtix_common"]

[tool.pytest.ini_options]
testpaths = ["services"]
# Services have test files with the same names; importlib mode keeps them apart.
addopts = "--import-mode=importlib"
